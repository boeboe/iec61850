          cp /tmp/libiec61850/build/src/libiec61850.a libiec61850/lib/linux_armv8/
          cp /tmp/libiec61850/build/hal/libhal.a libiec61850/lib/linux_armv8/
          cp /usr/lib/aarch64-linux-gnu/libmbedtls.a libiec61850/lib/linux_armv8/
          cp /usr/lib/aarch64-linux-gnu/libmbedx509.a libiec61850/lib/linux_armv8/

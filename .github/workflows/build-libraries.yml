      - name: Debug - Check libraries and symbols
        run: |
          echo "=== Library files ==="
          ls -lh libiec61850/lib/darwin_amd64/
          echo ""
          echo "=== Check for TLS symbols in libiec61850.a ==="
          nm libiec61850/lib/darwin_amd64/libiec61850.a | grep -i tls || echo "No TLS symbols found!"
          echo ""
          echo "=== Check config_darwin_amd64.go LDFLAGS ==="
          grep -A 10 'LDFLAGS' config_darwin_amd64.go || echo "config_darwin_amd64.go not found - will use fallback config"
          echo ""
          echo "=== CMake cache for TLS/MBEDTLS ==="
          grep -i 'mbedtls\|tls' /tmp/libiec61850/build/CMakeCache.txt || echo "No mbedtls entries in CMakeCache"

      - name: Test Go build
        run: |
          go build -v ./...
          echo "Go build successful for darwin_amd64!"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libiec61850-darwin-x64
          path: libiec61850/lib/darwin_amd64/*.a
          retention-days: 30

  build-windows-amd64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            make

      - name: Install mbedtls from source
        shell: msys2 {0}
        run: |
          # Build mbedtls 2.28 from source with MinGW (compatible with Go CGo)
          git clone --depth 1 --branch v2.28.8 https://github.com/Mbed-TLS/mbedtls.git /c/Temp/mbedtls
          cd /c/Temp/mbedtls
          mkdir build
          cd build
          cmake -G "Ninja" \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                -DCMAKE_C_COMPILER=gcc \
                -DCMAKE_CXX_COMPILER=g++ \
                -DCMAKE_C_FLAGS="-DMBEDTLS_PLATFORM_SNPRINTF_ALT -DMBEDTLS_PLATFORM_VSNPRINTF_ALT" \
                -DENABLE_PROGRAMS=OFF \
                -DENABLE_TESTING=OFF \
                ..
          ninja
          echo "Built mbedtls libraries:"
          ls -lh library/

      - name: Clone libiec61850
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch ${{ env.LIBIEC61850_VERSION }} https://github.com/mz-automation/libiec61850.git /c/temp/libiec61850

      - name: Enable advanced features
        shell: msys2 {0}
        run: |
          cd /c/temp/libiec61850
          sed -i 's/#define CONFIG_IEC61850_R_GOOSE 0/#define CONFIG_IEC61850_R_GOOSE 1/' config/stack_config.h
          sed -i 's/#define CONFIG_IEC61850_R_SMV 0/#define CONFIG_IEC61850_R_SMV 1/' config/stack_config.h
          sed -i 's/#define CONFIG_IEC61850_SNTP_CLIENT 0/#define CONFIG_IEC61850_SNTP_CLIENT 1/' config/stack_config.h
          sed -i 's/#define CONFIG_MMS_SUPPORT_TLS 0/#define CONFIG_MMS_SUPPORT_TLS 1/' config/stack_config.h

      - name: Debug - Verify mbedtls libraries
        shell: msys2 {0}
        run: |
          echo "=== mbedtls libraries ==="
          ls -lh /c/Temp/mbedtls/build/library/
          echo ""
          echo "=== Checking library exists ==="
          test -f /c/Temp/mbedtls/build/library/libmbedtls.a && echo "libmbedtls.a found" || echo "libmbedtls.a NOT found"

      - name: Build library
        shell: msys2 {0}
        run: |
          cd /c/temp/libiec61850
          mkdir build
          cd build
          cmake -G "Ninja" \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=gcc \
                -DCMAKE_CXX_COMPILER=g++ \
                -DWITH_MBEDTLS=1 \
                -DCONFIG_EXTERNAL_MBEDTLS_INCLUDE_PATH=/c/Temp/mbedtls/include \
                -DMBEDTLS_INCLUDE_DIR=/c/Temp/mbedtls/include \
                -DMBEDTLS_LIBRARY=/c/Temp/mbedtls/build/library/libmbedtls.a \
                -DMBEDX509_LIBRARY=/c/Temp/mbedtls/build/library/libmbedx509.a \
                -DMBEDCRYPTO_LIBRARY=/c/Temp/mbedtls/build/library/libmbedcrypto.a \
                -DBUILD_EXAMPLES=OFF \
                -DBUILD_PYTHON_BINDINGS=OFF \
                ..
          # Build only static libraries (hal and iec61850 targets), skip shared libraries
          ninja hal
          ninja iec61850

      - name: Copy library to workspace
        shell: msys2 {0}
        run: |
          mkdir -p libiec61850/lib/win64
          cp /c/temp/libiec61850/build/src/libiec61850.a libiec61850/lib/win64/
          cp /c/temp/libiec61850/build/hal/libhal.a libiec61850/lib/win64/
          cp /c/Temp/mbedtls/build/library/libmbedtls.a libiec61850/lib/win64/
          cp /c/Temp/mbedtls/build/library/libmbedx509.a libiec61850/lib/win64/
          cp /c/Temp/mbedtls/build/library/libmbedcrypto.a libiec61850/lib/win64/
          echo "=== Copied libraries ==="
          ls -lh libiec61850/lib/win64/

      - name: Verify library
        shell: msys2 {0}
        run: |
          echo "=== Library verification ==="
          ls -lh libiec61850/lib/win64/libiec61850.a
          file libiec61850/lib/win64/libiec61850.a
          echo ""
          echo "=== Checking for TLS symbols ==="
          nm libiec61850/lib/win64/libiec61850.a | grep -i TLSConfiguration | head -10 || echo "No TLS symbols found"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Debug - Check libraries and symbols
        shell: msys2 {0}
        run: |
          echo "=== Library files ==="
          ls -lh libiec61850/lib/win64/
          echo ""
          echo "=== Check config_win64.go LDFLAGS ==="
          grep -A 10 'LDFLAGS' config_win64.go || echo "LDFLAGS not found"
          echo ""
          echo "=== Check snprintf symbols in libiec61850.a (looking for __imp__ imports) ==="
          nm libiec61850/lib/win64/libiec61850.a | grep -i snprintf | head -20 || echo "No snprintf symbols"
          echo ""
          echo "=== Check vsnprintf symbols in libiec61850.a ==="
          nm libiec61850/lib/win64/libiec61850.a | grep -i vsnprintf | head -20 || echo "No vsnprintf symbols"
          echo ""
          echo "=== Check snprintf in libmbedcrypto.a ==="
          nm libiec61850/lib/win64/libmbedcrypto.a | grep -i snprintf | head -20 || echo "No snprintf symbols"
          echo ""
          echo "=== Extract and check one object file from libiec61850.a ==="
          cd /tmp && ar x /c/temp/libiec61850/build/src/libiec61850.a mms_value.c.obj 2>/dev/null || true
          if [ -f mms_value.c.obj ]; then
            echo "Object file extracted, checking compile flags in debug info..."
            strings mms_value.c.obj | grep -i "mingw\|ansi\|stdio" | head -10 || echo "No relevant strings found"
          fi
          echo ""
          echo "=== CMake cache for TLS/MBEDTLS ==="
          grep -i 'mbedtls\|tls' /c/temp/libiec61850/build/CMakeCache.txt || echo "No TLS entries in cache"
          echo ""
          echo "=== Check CMAKE_C_FLAGS in cache ==="
          grep -i 'CMAKE_C_FLAGS' /c/temp/libiec61850/build/CMakeCache.txt || echo "No C_FLAGS found"

      - name: Test Go build
        env:
          CGO_ENABLED: 1
          CC: D:/a/_temp/msys64/mingw64/bin/x86_64-w64-mingw32-gcc.exe
          CXX: D:/a/_temp/msys64/mingw64/bin/x86_64-w64-mingw32-g++.exe
        run: |
          echo "=== Forcing CGO to use MinGW toolchain ==="
          go env | Select-String "CC|CXX|CGO"
          echo ""
          go build -v -ldflags "-extldflags=-static" ./...
          echo "Go build successful for win64!"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libiec61850-windows-x64
          path: libiec61850/lib/win64/*.a
          retention-days: 30

  verify-and-commit:
    name: Verify and Commit Libraries
    needs: [build-linux-amd64, build-linux-armv7l, build-linux-armv8, build-macos-arm64, build-macos-amd64, build-windows-amd64]
    runs-on: ubuntu-latest
    if: github.event.inputs.commit_libraries == 'true' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy libraries to correct locations
        run: |
          mkdir -p libiec61850/lib/linux64
          mkdir -p libiec61850/lib/linux_armv7l
          mkdir -p libiec61850/lib/linux_armv8
          mkdir -p libiec61850/lib/darwin_armv8
          mkdir -p libiec61850/lib/darwin_amd64
          mkdir -p libiec61850/lib/win64
          
          cp artifacts/libiec61850-linux64/*.a libiec61850/lib/linux64/
          cp artifacts/libiec61850-linux-armv7l/*.a libiec61850/lib/linux_armv7l/
          cp artifacts/libiec61850-linux-armv8/*.a libiec61850/lib/linux_armv8/
          cp artifacts/libiec61850-darwin-arm64/*.a libiec61850/lib/darwin_armv8/
          cp artifacts/libiec61850-darwin-x64/*.a libiec61850/lib/darwin_amd64/
          cp artifacts/libiec61850-windows-x64/*.a libiec61850/lib/win64/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Verify build on Linux
        run: |
          go build ./...
          echo "Build successful!"

      - name: List all libraries
        run: |
          echo "Built libraries:"
          ls -lh libiec61850/lib/*/libiec61850.a

      - name: Configure Git
        if: github.event.inputs.commit_libraries == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Commit libraries
        if: github.event.inputs.commit_libraries == 'true'
        run: |
          git add libiec61850/lib/*/*.a
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build: Update libiec61850 v1.6.1 libraries for all platforms" \
                       -m "" \
                       -m "Built with:" \
                       -m "- R-GOOSE enabled" \
                       -m "- R-SMV enabled" \
                       -m "- SNTP client enabled" \
                       -m "" \
                       -m "Platforms:" \
                       -m "- Linux x86_64" \
                       -m "- Linux ARMv7l" \
                       -m "- Linux ARMv8 (ARM64)" \
                       -m "- macOS ARM64" \
                       -m "- macOS x64" \
                       -m "- Windows x64" \
                       -m "" \
                       -m "Auto-built by GitHub Actions"
            git push
          fi

      - name: Create artifact summary
        run: |
          echo "# Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Built Libraries" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Size | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux x86_64 | $(du -h libiec61850/lib/linux64/libiec61850.a | cut -f1) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux ARMv7l | $(du -h libiec61850/lib/linux_armv7l/libiec61850.a | cut -f1) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux ARMv8 | $(du -h libiec61850/lib/linux_armv8/libiec61850.a | cut -f1) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS ARM64 | $(du -h libiec61850/lib/darwin_armv8/libiec61850.a | cut -f1) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS x64 | $(du -h libiec61850/lib/darwin_amd64/libiec61850.a | cut -f1) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows x64 | $(du -h libiec61850/lib/win64/libiec61850.a | cut -f1) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- libiec61850: v1.6.1" >> $GITHUB_STEP_SUMMARY
          echo "- R-GOOSE: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
          echo "- R-SMV: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
          echo "- SNTP Client: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
